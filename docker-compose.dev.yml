services:
  sprobot:
    build:
      context: .
      target: dev
    init: true
    volumes:
      - sprobot-cache:/sprobot-cache

  sprobot-web:
    build:
      context: .
      target: devweb
    ports:
      - "8080:8080"

  stickybot:
    build:
      context: .
      target: devstickybot
    init: true

  threadbot:
    build:
      context: .
      target: devthreadbot
    init: true

volumes:
  sprobot-cache:
