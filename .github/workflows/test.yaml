name: test

on:
  pull_request:
  push:
    branches-ignore:
      - main # main pushes are tested via publish.yaml's workflow_call
      - 'dependabot/**' # Dependabot branches get ran through pull_request
  workflow_call: # publish.yaml tests main before pushing images
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same PR or branch cancels the older one. Under
# workflow_call, github.workflow is the caller ("publish"), whose own
# concurrency group already serializes its runs, so those are never cancelled.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'test' }}

jobs:
  test:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
      fail-fast: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: sprobot-test
          target: test
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # vet and the race tests compile everything inside `docker run`, so a
      # host directory mounted as the container's Go build cache carries the
      # compiled packages, and passing test results, from run to run. The key
      # changes only with go.mod/go.sum; a miss starts from this platform's
      # newest older cache. It lives outside the workspace so the prod image
      # builds below don't send it as build context.
      - name: Go build cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/go-build-cache
          key: go-test-${{ matrix.platform }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ matrix.platform }}-

      - name: Run vet and tests
        run: docker run --platform ${{ matrix.platform }} -v "${{ runner.temp }}/go-build-cache:/root/.cache/go-build" sprobot-test

      # Catch a broken prod stage before merge. The builder already holds the
      # base stage from the test image. publish.yaml builds and pushes these
      # itself, so they are skipped when it calls this workflow.
      - name: Build prod images (amd64, not pushed)
        if: matrix.platform == 'linux/amd64' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: |
          # With a VERSION, as publish.yaml builds them: each build stage
          # checks its binary prints it.
          for target in prod prodweb prodstickybot prodthreadbot; do
            docker buildx build --platform linux/amd64 --target "$target" --build-arg VERSION="${GITHUB_SHA:0:7}" .
          done
