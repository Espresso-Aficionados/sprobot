name: test

on:
  pull_request:
  push:
    branches-ignore:
      - main # main pushes are tested via publish.yaml's workflow_call
      - 'dependabot/**' # Dependabot branches get ran through pull_request
  workflow_call: # publish.yaml tests main before pushing images
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same PR or branch cancels the older one. Under
# workflow_call, github.workflow is the caller ("publish"), whose own
# concurrency group already serializes its runs, so those are never cancelled.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'test' }}

jobs:
  test:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
      fail-fast: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: sprobot-test
          target: test
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Run vet and tests
        run: docker run --platform ${{ matrix.platform }} sprobot-test

      # Catch a broken prod stage before merge. The builder already holds the
      # base stage from the test image. publish.yaml builds and pushes these
      # itself, so they are skipped when it calls this workflow.
      - name: Build prod images (amd64, not pushed)
        if: matrix.platform == 'linux/amd64' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: |
          for target in prod prodweb prodstickybot prodthreadbot; do
            docker buildx build --platform linux/amd64 --target "$target" .
          done
