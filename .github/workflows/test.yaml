name: test

on:
  pull_request:
  push:
    branches-ignore:
      - main # main pushes are tested via publish.yaml's workflow_call
      - 'dependabot/**' # Dependabot branches get ran through pull_request
  workflow_call: # publish.yaml tests main before pushing images
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same PR or branch cancels the older one. Under
# workflow_call, github.workflow is the caller ("publish"), whose own
# concurrency group already serializes its runs, so those are never cancelled.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'test' }}

jobs:
  # gofmt, go vet, go test -race, golangci-lint and govulncheck (sadbox/ci
  # STANDARDS.md, Go), inside the Dockerfile's `test` target (the image's
  # Go and the sources in its WORKDIR), natively on linux/amd64 and
  # linux/arm64. golangci-lint uses sadbox/ci's default configuration.
  go:
    uses: sadbox/ci/.github/workflows/go.yml@d22f8f95bcc884ba539ce3f53c552823cff3230d # v0.6.0
    permissions:
      contents: read

  # Catch a broken prod stage before merge. publish.yaml builds and pushes
  # these itself, so they are skipped when it calls this workflow.
  prod-images:
    name: prod images (linux/amd64)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build prod images (amd64, not pushed)
        run: |
          # With a VERSION, as publish.yaml builds them: each build stage
          # checks its binary prints it. The targets share the base stage,
          # so it is built once.
          for target in prod prodweb prodstickybot prodthreadbot; do
            docker buildx build --platform linux/amd64 --target "$target" --build-arg VERSION="${GITHUB_SHA:0:7}" .
          done
