name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch: # always builds

permissions:
  contents: read

# One publish at a time, so an older commit's run cannot finish after a newer
# one. A running publish is never cancelled; a newer run replaces one that is
# still waiting. Re-runs get a group of their own, so re-running an old run
# cannot cancel the waiting run for main's tip; the tip check in
# publish-merge keeps a re-run of an old commit from moving :latest.
concurrency:
  group: ${{ github.run_attempt == '1' && 'publish' || format('publish-rerun-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Does this push change what goes into the images? Compared with the commit
  # :latest was built from (its revision label), not with the previous push:
  # bonnet's podman-auto-update restarts a bot whenever its :latest moves, so
  # a docs-only push publishes nothing, and since the comparison is against
  # what :latest actually holds, a skipped run can never strand an earlier
  # code push (the next run builds whatever :latest is missing). Anything
  # outside the docs list counts as an image change.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # to diff against :latest's commit
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compare with :latest
        id: compare
        env:
          EVENT: ${{ github.event_name }}
        run: |
          decide() { # build reason
            echo "build=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::build=$1: $2"
            exit 0
          }
          [ "$EVENT" = workflow_dispatch ] && decide true "manual run"
          revs=()
          for image in sprobot sprobot-web stickybot threadbot; do
            revs+=("$(docker buildx imagetools inspect "ghcr.io/espresso-aficionados/${image}:latest" \
              --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision" }}' \
              2>/dev/null || true)")
          done
          base=${revs[0]}
          for rev in "${revs[@]}"; do
            [ -n "$rev" ] && [ "$rev" = "$base" ] || decide true "the :latest images don't share one revision (${revs[*]})"
          done
          git cat-file -e "${base}^{commit}" 2>/dev/null || decide true ":latest's revision ${base} isn't in this repo's history"
          if git diff --quiet "$base" "$GITHUB_SHA" -- . ':(exclude)*.md' ':(exclude)docs' ':(exclude)LICENSE'; then
            decide false "only docs changed since :latest (${base::7})"
          fi
          decide true "image inputs changed since :latest (${base::7})"

  test:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/test.yaml

  publish-build:
    needs: [test]
    permissions:
      contents: read
      packages: write # push to ghcr.io/espresso-aficionados with the workflow token
    strategy:
      matrix:
        include:
          - image: ghcr.io/espresso-aficionados/sprobot
            target: prod
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-bot-amd64
          - image: ghcr.io/espresso-aficionados/sprobot
            target: prod
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-bot-arm64
          - image: ghcr.io/espresso-aficionados/sprobot-web
            target: prodweb
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-web-amd64
          - image: ghcr.io/espresso-aficionados/sprobot-web
            target: prodweb
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-web-arm64
          - image: ghcr.io/espresso-aficionados/stickybot
            target: prodstickybot
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-stickybot-amd64
          - image: ghcr.io/espresso-aficionados/stickybot
            target: prodstickybot
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-stickybot-arm64
          - image: ghcr.io/espresso-aficionados/threadbot
            target: prodthreadbot
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-threadbot-amd64
          - image: ghcr.io/espresso-aficionados/threadbot
            target: prodthreadbot
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-threadbot-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit attestations: full provenance and an SBOM, pushed with
          # the image as an attestation manifest (unknown/unknown) in its
          # index; publish-merge carries them into each multi-arch index.
          provenance: mode=max
          sbom: true
          # source links each GHCR package to this repo (access inheritance).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=${{ matrix.platform }}
            type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          echo "$DIGEST" > /tmp/digests/digest.txt

      - name: Compute artifact name
        run: |
          image="${{ matrix.image }}"
          platform="${{ matrix.platform }}"
          echo "ARTIFACT_NAME=digest-${image//\//-}-${platform//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/digests/digest.txt
          retention-days: 1

  # One job for all four images: the tip of main is checked once per run, so
  # the images move :latest together, and re-running a failed merge always
  # checks the tip again.
  publish-merge:
    needs: [publish-build]
    permissions:
      contents: read
      packages: write
    outputs:
      subjects: ${{ steps.merge.outputs.subjects }} # [{name, digest}] per pushed index
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Each digest-<image>-<platform> artifact lands in a directory of that
      # name.
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests

      # :latest moves only if this commit is still the tip of main, so a
      # re-run of an old run, or a run main moved past while it built, cannot
      # move it back. Publish runs are serialized, so the check holds until
      # the push. sha-<short> is write-once: a later build of the same commit
      # (a re-run) is tagged sha-<short>-<UTC time>
      # instead, so every pushed image keeps a tag of its own. A failed
      # lookup counts as not pushed yet. Every index pushed is recorded
      # (image + digest, once per digest) for the attest job.
      - name: Create manifests and push
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subjects=/tmp/subjects.jsonl
          : > "$subjects"
          create() { # image tag
            local dir="/tmp/digests/digest-${1//\//-}" amd64 arm64 digest
            amd64=$(cat "${dir}-linux-amd64/digest.txt")
            arm64=$(cat "${dir}-linux-arm64/digest.txt")
            docker buildx imagetools create -t "${1}:${2}" "${1}@${amd64}" "${1}@${arm64}"
            digest=$(docker buildx imagetools inspect "${1}:${2}" --format '{{json .Manifest}}' | jq -r .digest)
            jq -cn --arg name "$1" --arg digest "$digest" '{name: $name, digest: $digest}' >> "$subjects"
          }
          registry=ghcr.io/espresso-aficionados
          images=("$registry/sprobot" "$registry/sprobot-web" "$registry/stickybot" "$registry/threadbot")
          sha_tag="sha-${GITHUB_SHA::7}"
          rebuild_tag="${sha_tag}-$(date -u +%Y%m%d-%H%M%S)"
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          for image in "${images[@]}"; do
            if docker buildx imagetools inspect "${image}:${sha_tag}" >/dev/null 2>&1; then
              create "$image" "$rebuild_tag"
            else
              create "$image" "$sha_tag"
            fi
          done
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at ${tip}, not ${GITHUB_SHA}; not moving :latest (its run builds whatever :latest lacks)"
          else
            for image in "${images[@]}"; do
              create "$image" latest
            done
          fi
          echo "subjects=$(jq -sc 'unique_by(.digest)' "$subjects")" >> "$GITHUB_OUTPUT"

  # GitHub artifact attestations (build provenance, signed through the
  # workflow's OIDC token) for each multi-arch index publish-merge pushed,
  # also pushed to GHCR next to the image. Its own job, so only it holds
  # id-token/attestations, and a failed attestation can be re-run without
  # rebuilding or re-tagging anything. No storage record (that needs
  # artifact-metadata: write). Verify with
  #   gh attestation verify oci://ghcr.io/espresso-aficionados/<image>:<tag> -R Espresso-Aficionados/sprobot
  attest:
    needs: [publish-merge]
    permissions:
      contents: read
      id-token: write # sign the attestation (Sigstore, via the OIDC token)
      attestations: write # store it in this repository's attestations
      packages: write # push it to ghcr.io next to the image
    strategy:
      matrix:
        subject: ${{ fromJSON(needs.publish-merge.outputs.subjects) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true
          create-storage-record: false
