name: publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * 1,3,5'

permissions:
  contents: read

# One publish at a time, so an older commit's run cannot finish after a newer
# one. A running publish is never cancelled; a newer run replaces one that is
# still waiting. Re-runs get a group of their own, so re-running an old run
# cannot cancel the waiting run for main's tip; the tip check in
# publish-merge keeps a re-run of an old commit from moving :latest.
concurrency:
  group: ${{ github.run_attempt == '1' && 'publish' || format('publish-rerun-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  publish-build:
    needs: [test]
    strategy:
      matrix:
        include:
          - image: sadbox/sprobot
            target: prod
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-bot-amd64
          - image: sadbox/sprobot
            target: prod
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-bot-arm64
          - image: sadbox/sprobot-web
            target: prodweb
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-web-amd64
          - image: sadbox/sprobot-web
            target: prodweb
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-web-arm64
          - image: sadbox/stickybot
            target: prodstickybot
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-stickybot-amd64
          - image: sadbox/stickybot
            target: prodstickybot
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-stickybot-arm64
          - image: sadbox/threadbot
            target: prodthreadbot
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-threadbot-amd64
          - image: sadbox/threadbot
            target: prodthreadbot
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-threadbot-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.platform }}
            type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest.txt

      - name: Compute artifact name
        run: |
          image="${{ matrix.image }}"
          platform="${{ matrix.platform }}"
          echo "ARTIFACT_NAME=digest-${image//\//-}-${platform//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/digests/digest.txt
          retention-days: 1

  # One job for all four images: the tip of main is checked once per run, so
  # the images move :latest together, and re-running a failed merge always
  # checks the tip again.
  publish-merge:
    needs: [publish-build]
    runs-on: ubuntu-26.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Each digest-<image>-<platform> artifact lands in a directory of that
      # name.
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests

      # :latest moves only if this commit is still the tip of main, so a
      # re-run of an old run, or a run main moved past while it built, cannot
      # move it back. Publish runs are serialized, so the check holds until
      # the push. sha-<short> is write-once: a later build of the same commit
      # (a scheduled rebuild or a re-run) is tagged sha-<short>-<UTC time>
      # instead, so every pushed image keeps a tag of its own. A failed
      # lookup counts as not pushed yet.
      - name: Create manifests and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create() { # image tag
            local dir="/tmp/digests/digest-${1//\//-}" amd64 arm64
            amd64=$(cat "${dir}-linux-amd64/digest.txt")
            arm64=$(cat "${dir}-linux-arm64/digest.txt")
            docker buildx imagetools create -t "${1}:${2}" "${1}@${amd64}" "${1}@${arm64}"
          }
          images=(sadbox/sprobot sadbox/sprobot-web sadbox/stickybot sadbox/threadbot)
          sha_tag="sha-${GITHUB_SHA::7}"
          rebuild_tag="${sha_tag}-$(date -u +%Y%m%d-%H%M%S)"
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          for image in "${images[@]}"; do
            if docker buildx imagetools inspect "${image}:${sha_tag}" >/dev/null 2>&1; then
              create "$image" "$rebuild_tag"
            else
              create "$image" "$sha_tag"
            fi
          done
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at ${tip}, not ${GITHUB_SHA}; not moving :latest"
            exit 0
          fi
          for image in "${images[@]}"; do
            create "$image" latest
          done
