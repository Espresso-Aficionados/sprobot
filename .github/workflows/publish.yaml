name: publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * 1,3,5'

permissions:
  contents: read

# One publish at a time, so an older commit's run cannot finish after a newer
# one. A running publish is never cancelled; a newer run replaces one that is
# still waiting.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  publish-build:
    needs: [test]
    strategy:
      matrix:
        include:
          - image: sadbox/sprobot
            target: prod
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-bot-amd64
          - image: sadbox/sprobot
            target: prod
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-bot-arm64
          - image: sadbox/sprobot-web
            target: prodweb
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-web-amd64
          - image: sadbox/sprobot-web
            target: prodweb
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-web-arm64
          - image: sadbox/stickybot
            target: prodstickybot
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-stickybot-amd64
          - image: sadbox/stickybot
            target: prodstickybot
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-stickybot-arm64
          - image: sadbox/threadbot
            target: prodthreadbot
            platform: linux/amd64
            runner: ubuntu-26.04
            cache-scope: publish-threadbot-amd64
          - image: sadbox/threadbot
            target: prodthreadbot
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            cache-scope: publish-threadbot-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.platform }}
            type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest.txt

      - name: Compute artifact name
        run: |
          image="${{ matrix.image }}"
          platform="${{ matrix.platform }}"
          echo "ARTIFACT_NAME=digest-${image//\//-}-${platform//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/digests/digest.txt
          retention-days: 1

  publish-merge:
    needs: [publish-build]
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - image: sadbox/sprobot
            artifact-prefix: digest-sadbox-sprobot
          - image: sadbox/sprobot-web
            artifact-prefix: digest-sadbox-sprobot-web
          - image: sadbox/stickybot
            artifact-prefix: digest-sadbox-stickybot
          - image: sadbox/threadbot
            artifact-prefix: digest-sadbox-threadbot
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact-prefix }}-linux-amd64
          path: /tmp/digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact-prefix }}-linux-arm64
          path: /tmp/digests/arm64

      # A re-run of an old run, or a run that main moved past while it built,
      # must not move :latest back. Such runs push only the sha- tag; the run
      # for main's tip moves :latest.
      - name: Check commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at ${tip}, not ${GITHUB_SHA}; not moving ${{ matrix.image }}:latest"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest and push
        env:
          IMAGE: ${{ matrix.image }}
          LATEST: ${{ steps.tip.outputs.latest }}
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64/digest.txt)
          ARM64_DIGEST=$(cat /tmp/digests/arm64/digest.txt)
          tags=(-t "${IMAGE}:sha-${GITHUB_SHA::7}")
          if [ "$LATEST" = true ]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
